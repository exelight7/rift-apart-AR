name: Build and publish installer
on:
  push:
    branches: [main]
    paths: ['installer/**', 'tools/**', 'editable/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  PYTHONUTF8: '1'
  QT_QPA_PLATFORM: offscreen
defaults:
  run:
    shell: bash
concurrency:
  group: release-installer
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: Linux-x86_64
          - os: windows-2022
            platform: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libpulse0 libasound2 libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0 fonts-noto-core
      - run: python -m pip install -r requirements.txt -r installer/requirements.txt
      - name: Validate and build localization
        run: |
          python tools/validate.py
          python tools/fix_launcher.py
          python tools/build_release.py
          python tools/package_payload.py
          python tools/verify_payload_build.py
          python tools/audit_progress.py
          python -m unittest discover -s tests -v
      - name: Build desktop application
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name RiftApartAR --paths installer --add-data "installer/payload:payload" --add-data "installer/assets:assets" --distpath build/dist --workpath build/pyinstaller installer/app.py
      - name: Package application
        run: python tools/package_installer.py --platform ${{ matrix.platform }}
      - name: Test packaged application
        run: python tools/smoke_frozen.py build/dist/RiftApartAR/RiftApartAR${{ runner.os == 'Windows' && '.exe' || '' }} build/frozen-smoke.png
      - name: Build and test AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          python tools/package_appimage.py
          python tools/smoke_frozen.py build/release/RiftApartAR-v1.0.0-Linux-x86_64.AppImage build/appimage-smoke.png
      - name: Build and test Windows EXE
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name RiftApartAR --paths installer --add-data "installer/payload:payload" --add-data "installer/assets:assets" --add-data "build/dist/RiftApartAR/licenses:licenses" --add-data "tools/LICENSE:." --add-data "NOTICE.md:." --add-data "RELEASE_NOTES.md:." --distpath build/standalone --workpath build/pyinstaller-standalone installer/app.py
          python tools/smoke_frozen.py build/standalone/RiftApartAR.exe build/exe-smoke.png
          python tools/package_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: build/release/*
          retention-days: 14
  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: build/release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 build/release/* --clobber
            gh release edit v1.0.0 --notes-file RELEASE_NOTES.md --prerelease=false --latest
          else
            gh release create v1.0.0 build/release/* --target "$GITHUB_SHA" --title "Rift Apart AR 1.0.0" --notes-file RELEASE_NOTES.md --latest
          fi
